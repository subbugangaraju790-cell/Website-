    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => alert('Copied!')).catch(() => alert('Copy failed'));
        return;
      }
      const tempInput = document.createElement('textarea');
      tempInput.value = text;
      tempInput.setAttribute('readonly', '');
      tempInput.style.position = 'fixed';
      tempInput.style.left = '-9999px';
      document.body.appendChild(tempInput);
      tempInput.select();
      try { document.execCommand('copy'); alert('Copied!'); } catch { alert('Copy failed'); }
      document.body.removeChild(tempInput);
    }

      const cart = loadCart();
      const item = cart.find(i => i.id === productId);
      if (item) {
        if (item.qty + qty > product.stock) return alert('Cannot add more than available stock');
        item.qty += qty;
      } else {
        cart.push({ id: product.id, name: product.name, price: product.price, qty });
      }
      saveCart(cart);
      logActivity('Added to cart', product.name);
      alert('Added to cart');
    }

        stockInput.value = '';
        imageInput.value = '';
        preview.style.display = 'none';
        addProductButton.textContent = 'Add Product';
        formTitle.textContent = 'Add New Component';
        cancelEditButton.style.display = 'none';

      function populateForm(product) {
        editingIndex = product.index;
        nameInput.value = product.name;
        categoryInput.value = product.category;
        descriptionInput.value = product.description;
        priceInput.value = product.price;
        stockInput.value = product.stock;
        selectedImage = product.image;
        preview.src = selectedImage;
        preview.style.display = 'block';
        addProductButton.textContent = 'Update Product';
        formTitle.textContent = 'Edit Component';
        cancelEditButton.style.display = 'inline-flex';
      }
      imageInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = event => {
          selectedImage = event.target.result;
          preview.src = selectedImage;
          preview.style.display = 'block';
        };
        reader.readAsDataURL(file);
      });
      addProductButton.addEventListener('click', () => {

          if (!product) return alert('Product missing');

          product.category = category;

          product.price = price;
          product.stock = stock;

          </td>
        `;
        inventoryBody.appendChild(row);

        const product = products[index];

        editProduct(index);

        if (fileInput) fileInput.click();
      };

        const card = document.createElement('article');
        card.className = 'feedback-card';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <h4>${fb.customer}</h4><span>${'⭐'.repeat(fb.rating)}</span>
          </div>
          <p><strong>Order:</strong> ${fb.orderId}</p>
          <p>${fb.comments}</p>
          <p style="color:#64748b;font-size:.9rem;">${new Date(fb.createdAt).toLocaleString()}</p>
        `;
        feedbackList.appendChild(card);
      });
    }

    function addChatMessage(author, text) {
      chatMessages.push({ author, text, createdAt: new Date().toISOString() });
      saveChatHistory(chatMessages);
    }

    function getBotReply(question) {
      const lower = question.toLowerCase();
      if (lower.includes('price')) return 'Prices show INR amounts on product cards.';
      if (lower.includes('order') || lower.includes('status')) return 'Track order status from the dashboard after placing an order.';
      if (lower.includes('cod') || lower.includes('cash')) return 'Cash on Delivery is available at checkout.';
      if (lower.includes('api')) return 'Use the API key in shop manager mode for integration.';
      return 'Ask about products, orders, COD, shop management, or drone parts.';
    }

    async function getGroqReply(question) {
      try {
        const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${API_KEY}`
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              { role: 'system', content: 'You are a helpful assistant for an electronics and drone store.' },
              { role: 'user', content: question }
            ],
            temperature: 0.7,
            max_tokens: 250
          })
        });
        if (!response.ok) throw new Error(`Groq request failed: ${response.status}`);
        const data = await response.json();
        return data.choices?.[0]?.message?.content?.trim() || getBotReply(question);
      } catch (error) {
        console.error(error);
        return getBotReply(question);
      }
    }

    function renderChatbot() {
      const view = document.getElementById('view');
      view.innerHTML = `
        <section class="section">
          <h3>Chatbot Assistant</h3>
          <div class="card">
            <div id="chat-messages" style="max-height:400px;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:16px;background:#f8fafc;border-radius:16px;"></div>
            <div style="display:flex;gap:12px;margin-top:16px;flex-wrap:wrap;">
              <input id="chat-input" type="text" placeholder="Ask about products or checkout..." style="flex:1;min-width:180px;" />
              <button class="button info" id="send-chat">Send</button>
            </div>
          </div>
        </section>
      `;
      const messagesEl = document.getElementById('chat-messages');
      function refreshChat() {
        messagesEl.innerHTML = '';
        chatMessages.forEach(msg => {
          const div = document.createElement('div');
          div.style.padding = '14px';
          div.style.borderRadius = '16px';
          div.style.maxWidth = '85%';
          if (msg.author === 'user') {
            div.style.alignSelf = 'flex-end';
            div.style.background = '#0ea5e9';
            div.style.color = '#fff';
          } else {
            div.style.alignSelf = 'flex-start';
            div.style.background = '#ecfccb';
            div.style.color = '#0f172a';
          }
          div.textContent = msg.text;
          messagesEl.appendChild(div);
        });
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      async function sendChat() {
        const input = document.getElementById('chat-input');
        const question = input.value.trim();
        if (!question) return;
        addChatMessage('user', question);
        refreshChat();
        input.value = '';
        const reply = await getGroqReply(question);
        addChatMessage('bot', reply);
        refreshChat();
      }
      document.getElementById('send-chat').addEventListener('click', sendChat);
      document.getElementById('chat-input').addEventListener('keydown', e => { if (e.key === 'Enter') sendChat(); });
      refreshChat();
    }

    function renderProjects() {
      const view = document.getElementById('view');
      view.innerHTML = `
        <section class="section">
          <h3>Mini Projects</h3>
          <div class="card" style="margin-bottom:24px;">
            <h4>Add New Mini Project</h4>
            <div class="form-group"><label>Title</label><input id="project-title" placeholder="Smart Plant Monitor" /></div>

            <div class="form-group"><label>Description</label><textarea id="project-description" rows="3" placeholder="Describe your project"></textarea></div>
            <div class="form-group"><label>Difficulty</label><input id="project-difficulty" placeholder="Easy" /></div>
            <div class="form-group"><label>Image URL</label><input id="project-image" placeholder="https://..." /></div>
            <div class="form-group"><label>Project PDF URL</label><input id="project-pdf" placeholder="https://..." /></div>

            <p>${project.description}</p>

            ${project.diagram ? `<img src="${project.diagram}" alt="${project.title} circuit diagram" class="product-image" style="height:160px;object-fit:cover;" />` : ''}
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;">${project.pdf ? `<a class="button info" href="${project.pdf}" target="_blank" rel="noopener">Project PDF</a>` : ''}${project.diagram ? `<a class="button" href="${project.diagram}" target="_blank" rel="noopener">View Diagram</a>` : ''}</div>

        });
      }

      document.getElementById('add-project').addEventListener('click', () => {
        const title = document.getElementById('project-title').value.trim();
        const category = document.getElementById('project-category').value.trim();
        const description = document.getElementById('project-description').value.trim();
        const difficulty = document.getElementById('project-difficulty').value.trim();
        const image = document.getElementById('project-image').value.trim();
        const pdf = document.getElementById('project-pdf').value.trim();
        const diagram = document.getElementById('project-diagram').value.trim();
        if (!title || !category || !description || !difficulty) return alert('Please fill all required fields');
        miniProjects.unshift({
          id: title.toLowerCase().replace(/[^a-z0-9]+/g, '-'),
          title,
          category,
          description,
          image: image || 'https://via.placeholder.com/300x200/0ea5e9/ffffff?text=New+Project',
          pdf: pdf || 'https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf',
          diagram: diagram || 'https://via.placeholder.com/300x200/0ea5e9/ffffff?text=Diagram',
          difficulty
        });
        saveMiniProjects(miniProjects);
        document.getElementById('project-title').value = '';
        document.getElementById('project-category').value = '';
        document.getElementById('project-description').value = '';
        document.getElementById('project-difficulty').value = '';
        document.getElementById('project-image').value = '';
        document.getElementById('project-pdf').value = '';
        document.getElementById('project-diagram').value = '';
        renderProjectsList();
        alert('Mini project added');
      });

      renderProjectsList();
    }

    function renderAiLab() {
      const view = document.getElementById('view');
      view.innerHTML = `
        <section class="section">
          <h3>Virtual Lab</h3>
          <div class="grid product-grid">
            <article class="card"><h4>⚡ Circuit Simulation</h4><p>Estimate voltage, current, and resistor behavior.</p></article>
            <article class="card"><h4>🚁 Drone Flight Lab</h4><p>Calculate flight time, battery draw, and hover efficiency.</p></article>
            <article class="card"><h4>🔋 Battery Health</h4><p>Check discharge rate and remaining capacity quickly.</p></article>
            <article class="card"><h4>📡 Sensor Lab</h4><p>Preview sensor response and threshold behavior.</p></article>
          </div>
          <div class="card" style="margin-top:24px;">
            <div class="form-group"><label>Simulation Type</label><select id="sim-type"><option value="response">Circuit</option><option value="flight">Drone</option><option value="battery">Battery</option><option value="sensor">Sensor</option></select></div>
            <div class="form-group"><label>Input Value</label><input id="sim-input" placeholder="Enter numeric value" /></div>
            <button class="button" id="run-sim">Run Simulation</button>
            <div id="sim-result" class="panel" style="margin-top:20px;white-space:pre-wrap;"></div>
          </div>
        </section>
      `;
      document.getElementById('run-sim').addEventListener('click', () => {
        const type = document.getElementById('sim-type').value;
        const value = parseFloat(document.getElementById('sim-input').value);
        if (isNaN(value)) return alert('Enter a valid number');
        let result = '';
        if (type === 'response') {
          const voltage = (5 * value / (value + 10)).toFixed(2);
          const current = (voltage / 1000).toFixed(4);
          result = `Circuit result:\nVoltage: ${voltage} V\nCurrent: ${current} A`;
        } else if (type === 'flight') {
          const hoverTime = Math.max(1, (20 - value / 2)).toFixed(1);
          result = `Flight result:\nEstimated hover time: ${hoverTime} min\nBattery draw: ${(value * 0.8).toFixed(1)} A`;
        } else if (type === 'battery') {
          result = `Battery result:\nEstimated remaining capacity: ${Math.max(0, 100 - value * 2).toFixed(1)}%\nEstimated life: ${(10 - value / 10).toFixed(1)} min`;
        } else {
          const threshold = value > 50 ? 'triggered' : 'safe';
          result = `Sensor result:\nDetected signal: ${value}\nStatus: ${threshold}`;
        }
        document.getElementById('sim-result').textContent = result;
        if (type === 'response') {
          logActivity('Electronic circuit log', `Circuit simulation run with input ${value} and voltage ${result.split('\n')[0].split(': ')[1]}`);
        } else {
          logActivity('Simulation log', `Mode: ${type}, input: ${value}`);
        }
      });
    }

    function renderDeliveryPlatform() {
      const view = document.getElementById('view');

        <section class="section">
          <h3>Delivery Platform</h3>
          <div class="panel">
            <p>Use this delivery platform to track shipments, view courier details, and monitor the status of your drone orders.</p>
          </div>
          ${user ? '' : '<div class="notice">Login as a customer to view delivery updates from the platform.</div>'}
          ${userOrders.length ? `
            <div class="grid">
              ${userOrders.slice().reverse().map(order => `
                <article class="order-card">
                  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;">
                    <div>
                      <h4>${order.orderId}</h4>
                      <p>${new Date(order.createdAt).toLocaleString()}</p>
                    </div>
                    <span class="order-status ${order.status}">${order.status}</span>
                  </div>
                  <div style="margin-top:16px;">
                    <p><strong>Courier:</strong> ${order.courier || 'Electronix Courier'}</p>
                    <p><strong>Tracking ID:</strong> ${order.trackingId || 'ETX-' + order.orderId}</p>
                    <p><strong>Delivery ETA:</strong> ${order.eta || '2-4 business days'}</p>
                  </div>
                  <div class="panel" style="margin-top:16px;">
                    <p><strong>Progress:</strong> ${order.progress || 'Packed and ready for dispatch'}</p>
                    <div style="margin-top:10px;height:8px;border-radius:999px;background:#e2e8f0;overflow:hidden;">
                      <div style="height:100%;width:${order.status === 'delivered' ? '100' : order.status === 'shipped' ? '75' : order.status === 'confirmed' ? '50' : '25'}%;background:linear-gradient(135deg,#00ff96,#0ea5e9);"></div>
                    </div>
                  </div>

                    <button class="button info" onclick="updateTrackingStatus('${order.orderId}', 'confirmed')">Mark Confirmed</button>
                    <button class="button info" onclick="updateTrackingStatus('${order.orderId}', 'shipped')">Ship</button>
                    <button class="button" onclick="updateTrackingStatus('${order.orderId}', 'delivered')">Deliver</button>
                  </div>
                </article>
              `).join('')}

      `;

    function renderDeliveryTracking() {
      return renderDeliveryPlatform();
    }

    function renderWebsiteLog() {
      const view = document.getElementById('view');
      const logs = loadWebsiteLog();
      view.innerHTML = `
        <section class="section">
          <h3>Website Activity Log</h3>
          <div class="panel">
            <p>Track recent website actions, page views, cart updates, and login activity.</p>
          </div>
          <div class="grid" style="grid-template-columns:1fr;">
            ${logs.length ? logs.map(entry => `
              <article class="card">
                <p><strong>${entry.event}</strong> ${entry.detail ? '– ' + entry.detail : ''}</p>
                <p style="color:#64748b;font-size:.9rem;margin-top:10px;">${new Date(entry.when).toLocaleString()}</p>
              </article>
            `).join('') : '<div class="notice">No activity log entries yet.</div>'}
          </div>
        </section>
      `;
    }

    window.updateTrackingStatus = function(orderId, status) {
      const orders = loadOrders();
      const order = orders.find(o => o.orderId === orderId);
      if (!order) return;
      order.status = status;
      order.updatedAt = new Date().toISOString();
      order.progress = status === 'delivered' ? 'Delivered to your address' : status === 'shipped' ? 'In transit to your location' : status === 'confirmed' ? 'Order confirmed and packed' : 'Awaiting confirmation';
      saveOrders(orders);
      renderDeliveryTracking();
    };

      view.innerHTML = `
        <section class="section">

          <div class="panel" style="max-width:700px;margin:auto;">

              <label>Preferred Currency</label>
              <select id="settings-currency">

    function renderView() {
      updateHeader();
      updateCartCount();
      const route = getRoute();
      if (route === 'home') return renderHome();
      if (route === 'cart') return renderCart();
      if (route === 'checkout') return renderCheckout();
      if (route === 'login-customer') return renderLoginCustomer();
      if (route === 'login-shopholder') return renderLoginShopholder();
      if (route === 'shopholder') return renderShopholder();
      if (route === 'dashboard') return renderDashboard();
      if (route === 'feedback') return renderFeedback();
      if (route === 'chatbot') return renderChatbot();
      if (route === 'settings') return renderSettings();
      if (route === 'delivery-platform' || route === 'delivery-tracking') return renderDeliveryPlatform();
      if (route === 'website-log') return renderWebsiteLog();
      if (route === 'virtual-lab' || route === 'ai-lab') return renderAiLab();
      if (route === 'projects') return renderProjects();
      if (route.startsWith('product-')) return renderProductDetail(route.replace('product-', ''));
      renderHome();
    }

    window.addEventListener('hashchange', renderView);
    window.addEventListener('DOMContentLoaded', () => {
      if (!location.hash) location.hash = '#home';
      renderView();
    });
  </script>
